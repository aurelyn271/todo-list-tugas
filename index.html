
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Tugas Kuliah</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #eef6ff;
            color: #334155;
            padding: 30px 15px;
        }

        .container {
            max-width: 650px;
            margin: auto;
        }

        .header {
            background: linear-gradient(135deg, #c9e5ff, #eaf5ff);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 22px;
        }

        .header h1 {
            color: #2466a3;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .header p {
            color: #54728e;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 22px;
        }

        .stat-box {
            background: white;
            padding: 15px 8px;
            text-align: center;
            border-radius: 12px;
        }

        .stat-box h2 {
            color: #388bdc;
            font-size: 23px;
        }

        .stat-box p {
            font-size: 12px;
            margin-top: 5px;
        }

        .card {
            background: white;
            padding: 23px;
            border-radius: 18px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(80, 130, 180, 0.07);
        }

        .card h3 {
            margin-bottom: 17px;
            color: #315d85;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 1px solid #d6e6f5;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #65a8ed;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.85;
        }

        .add-btn {
            background: #388bdc;
            color: white;
            padding: 12px 17px;
        }

        .task {
            background: #f8fbff;
            border: 1px solid #e0ebf7;
            border-radius: 13px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .task-content {
            flex: 1;
            min-width: 0;
        }

        .task-name {
            font-size: 15px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .motivation {
            color: #4285bd;
            background: #eaf4ff;
            padding: 8px 10px;
            border-radius: 8px;
            margin-top: 9px;
            font-size: 12px;
        }

        .completed .task-name {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .done-btn {
            background: #d9f5e5;
            color: #23844d;
            padding: 8px 10px;
            font-size: 12px;
        }

        .delete-btn {
            background: #ffe4e4;
            color: #d64c4c;
            padding: 8px 10px;
            font-size: 12px;
        }

        .empty {
            text-align: center;
            padding: 35px 10px;
            color: #94a3b8;
            font-size: 14px;
        }

        .progress-section {
            margin-top: 20px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 9px;
            background: #e4effa;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #4c9be5;
            transition: width 0.3s;
        }

        .footer {
            text-align: center;
            color: #7c9ab5;
            font-size: 12px;
            padding: 15px;
        }

        @media (max-width: 480px) {
            .input-area {
                flex-direction: column;
            }

            .add-btn {
                padding: 13px;
            }

            .header h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>☁️ My Study Space</h1>
        <p>One step at a time. Yuk, selesaikan tugasmu!</p>

        <div class="stats">
            <div class="stat-box">
                <h2 id="total">0</h2>
                <p>Total Tugas</p>
            </div>

            <div class="stat-box">
                <h2 id="completed">0</h2>
                <p>Selesai</p>
            </div>

            <div class="stat-box">
                <h2 id="remaining">0</h2>
                <p>Belum Selesai</p>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-info">
                <span>Progress Belajar</span>
                <span id="percent">0%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
        </div>
    </div>

    <div class="card">
        <h3>✏️ Tambahkan Tugas Baru</h3>

        <form class="input-area" id="taskForm">
            <input
                type="text"
                id="taskInput"
                placeholder="Masukkan nama tugas..."
                maxlength="120"
                required
            >

            <button type="submit" class="add-btn">
                + Tambah Tugas
            </button>
        </form>
    </div>

    <div class="card">
        <h3>📚 Daftar Tugas</h3>
        <div id="taskList">
            <div class="empty">
                📝<br><br>
                Belum ada tugas nih!<br>
                Yuk, tambahkan tugas pertamamu.
            </div>
        </div>
    </div>

    <div class="footer">
        🌷 Little progress is still progress.
        <br>
        Semangat kuliahnya!
    </div>

</div>

<script>

    // Kumpulan kalimat motivasi
    const motivations = [
        "Yuk bisa yuk, dikit lagi selesai! 💙",
        "Jangan tunda hari ini apa yang bisa dikerjakan sekarang!",
        "Satu langkah kecil menuju nilai A! ⭐",
        "Semangat! Usaha hari ini adalah hasil di kemudian hari.",
        "Pelan-pelan nggak apa-apa, yang penting tetap jalan!",
        "Kamu sudah mulai, itu juga sebuah pencapaian!",
        "Tugas selesai, pikiran lebih tenang. Yuk lanjut!",
        "Masa depanmu dibangun dari usaha kecil hari ini.",
        "Fokus satu tugas dulu, kamu pasti bisa!",
        "Semangat kuliahnya! Jangan menyerah di tengah jalan!"
    ];

    let tasks = JSON.parse(
        localStorage.getItem("studyTasks") || "[]"
    );

    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");

    // Menyimpan data tugas
    function saveTasks() {
        localStorage.setItem(
            "studyTasks",
            JSON.stringify(tasks)
        );
    }

    // Menambahkan tugas baru
    document.getElementById("taskForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const taskName = taskInput.value.trim();

        if (taskName === "") {
            return;
        }

        const randomMotivation =
            motivations[
                Math.floor(Math.random() * motivations.length)
            ];

        const newTask = {
            id: Date.now() + Math.random(),
            name: taskName,
            motivation: randomMotivation,
            completed: false
        };

        tasks.unshift(newTask);

        saveTasks();
        renderTasks();

        taskInput.value = "";
        taskInput.focus();
    });

    // Menampilkan daftar tugas
    function renderTasks() {

        taskList.innerHTML = "";

        if (tasks.length === 0) {
            taskList.innerHTML = `
                <div class="empty">
                    📝<br><br>
                    Belum ada tugas nih!<br>
                    Yuk, tambahkan tugas pertamamu.
                </div>
            `;
        }

        tasks.forEach(function(task) {

            const taskElement = document.createElement("div");

            taskElement.className = "task";

            if (task.completed) {
                taskElement.classList.add("completed");
            }

            const content = document.createElement("div");
            content.className = "task-content";

            const name = document.createElement("div");
            name.className = "task-name";
            name.textContent = task.name;

            const motivation = document.createElement("div");
            motivation.className = "motivation";
            motivation.textContent = "✨ " + task.motivation;

            content.appendChild(name);
            content.appendChild(motivation);

            const actions = document.createElement("div");
            actions.className = "actions";

            // Tombol selesai
            const doneButton = document.createElement("button");

            doneButton.className = "done-btn";
            doneButton.textContent = task.completed
                ? "Batal"
                : "✓ Selesai";

            doneButton.onclick = function() {
                toggleTask(task.id);
            };

            // Tombol hapus
            const deleteButton = document.createElement("button");

            deleteButton.className = "delete-btn";
            deleteButton.textContent = "Hapus";

            deleteButton.onclick = function() {
                deleteTask(task.id);
            };

            actions.appendChild(doneButton);
            actions.appendChild(deleteButton);

            taskElement.appendChild(content);
            taskElement.appendChild(actions);

            taskList.appendChild(taskElement);

        });

        updateStats();
    }

    // Menandai tugas selesai
    function toggleTask(id) {

        tasks = tasks.map(function(task) {

            if (task.id === id) {
                task.completed = !task.completed;
            }

            return task;
        });

        saveTasks();
        renderTasks();
    }

    // Menghapus tugas
    function deleteTask(id) {

        tasks = tasks.filter(function(task) {
            return task.id !== id;
        });

        saveTasks();
        renderTasks();
    }

    // Memperbarui statistik
    function updateStats() {

        const total = tasks.length;

        const completed = tasks.filter(
            task => task.completed
        ).length;

        const remaining = total - completed;

        const percentage = total === 0
            ? 0
            : Math.round((completed / total) * 100);

        document.getElementById("total").textContent = total;

        document.getElementById("completed").textContent =
            completed;

        document.getElementById("remaining").textContent =
            remaining;

        document.getElementById("percent").textContent =
            percentage + "%";

        document.getElementById("progress").style.width =
            percentage + "%";
    }

    // Menampilkan data saat halaman dibuka
    renderTasks();

</script>

</body>
</html>
